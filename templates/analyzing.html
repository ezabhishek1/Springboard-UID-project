<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Aadhaar Fraud Detection - Analyzing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <meta http-equiv="refresh" content="3;url={{ redirect_url }}" />
  </head>
  <body class="min-h-screen text-slate-100 relative overflow-x-hidden flex items-center justify-center">
    <!-- Cyber Background Elements -->
    <div class="cyber-grid"></div>
    <div class="glow-blob-1"></div>
    <div class="glow-blob-2"></div>

    <div class="max-w-md w-full mx-6 glass-panel p-8 rounded-2xl relative overflow-hidden text-center shadow-[0_0_50px_rgba(0,240,255,0.15)]">
      <div class="scan-line"></div>
      
      <div class="relative inline-block mb-6">
        <div class="absolute -inset-2 rounded-full border border-cyan-500/30 animate-ping opacity-75"></div>
        <div class="h-20 w-20 rounded-full border-2 border-dashed border-cyan-500 flex items-center justify-center animate-spin-slow">
          <svg class="h-10 w-10 text-cyan-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 009 11a13.92 13.92 0 00-2.3-7.558M12 11c0-3.517 1.009-6.799 2.753-9.571m3.44 2.04l-.054.09A13.916 13.916 0 0015 11a13.92 13.92 0 002.3 7.558M12 11a1 1 0 110-2 1 1 0 010 2z" />
          </svg>
        </div>
      </div>

      <h2 class="text-xl font-display font-bold text-white tracking-wide mb-2">Analyzing Aadhaar Card</h2>
      <p class="text-xs text-slate-400 font-mono mb-6 uppercase tracking-wider">Running AI-powered fraud detection...</p>
      
      <div class="space-y-3 font-mono text-xs text-left">
        <div class="flex items-center justify-between px-4 py-3 bg-slate-900/40 border border-slate-800 rounded-xl">
          <span class="text-slate-400">OCR Processing</span>
          <span class="text-emerald-400">✓ Complete</span>
        </div>
        <div class="flex items-center justify-between px-4 py-3 bg-slate-900/40 border border-slate-800 rounded-xl">
          <span class="text-slate-400">QR Code Decoding</span>
          <span class="text-emerald-400">✓ Complete</span>
        </div>
        <div class="flex items-center justify-between px-4 py-3 bg-cyan-950/20 border border-cyan-800/40 rounded-xl">
          <span class="text-cyan-400">Visual Analysis</span>
          <span class="text-cyan-400 animate-pulse">⟳ In Progress</span>
        </div>
        <div class="flex items-center justify-between px-4 py-3 bg-slate-900/20 border border-slate-900 rounded-xl text-slate-600">
          <span>Metadata Extraction</span>
          <span>○ Pending</span>
        </div>
      </div>
    </div>
  </body>
</html>
